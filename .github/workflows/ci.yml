name: macOS checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-checks:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run tests, release build, and app packaging
        run: bash Scripts/run-checks.sh
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldenrave-macOS
          path: dist
          if-no-files-found: error
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: goldenrave-macOS-dmg
          path: dist/goldenrave.dmg
          if-no-files-found: error
